name: Publish image

# Builds and pushes the hivemind MCP server image to GHCR.
#
# Deliberately separate from ci.yml: that workflow runs ruff/mypy/pytest on the
# runner via uv, which is faster than running them in a container and loses no
# isolation. This one only exists to produce a distributable artifact.
#
# The published package inherits the repository's visibility by default.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Image tag to publish (default: manual-<sha>)"
        type: string
        required: false

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  publish:
    name: build · smoke · push
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: _meta/mcp-server-py
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Derive tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}
            type=raw,value=${{ inputs.tag || format('manual-{0}', github.sha) }},enable=${{ github.event_name == 'workflow_dispatch' }}

      # Build locally first so a broken image is never pushed.
      - name: Build (load for smoke test)
        uses: docker/build-push-action@v6
        with:
          context: _meta/mcp-server-py
          target: runtime
          load: true
          tags: hivemind:smoke
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Drives a real JSON-RPC initialize against the image over stdio. -i is
      # mandatory: without it the server sees stdin EOF and exits immediately.
      - name: stdio smoke test
        run: |
          docker run -i --rm \
            -e HIVE_PATH=/hive \
            -e OBSIDIAN_FALLBACK_MODE=fs_only \
            -e HIVEMIND_SMOKE_CMD='python -m hivemind' \
            -v "${GITHUB_WORKSPACE}:/hive:ro" \
            --entrypoint python \
            hivemind:smoke /app/scripts/stdio-smoke.py --handshake-only

      - name: Push runtime image
        uses: docker/build-push-action@v6
        with:
          context: _meta/mcp-server-py
          target: runtime
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha

      # Separate tag suffix — the ONNX extra roughly triples image size, so it
      # should be an opt-in pull rather than the default.
      - name: Push embeddings image
        uses: docker/build-push-action@v6
        with:
          context: _meta/mcp-server-py
          target: runtime-embeddings
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:embeddings
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
